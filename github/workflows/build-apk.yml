name: Build SynthOS APK from ZIP

on:
push:
branches:
- main
paths:
- synthos-fieldwork-v1.0.0.zip
- .github/workflows/build-apk.yml
pull_request:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify source ZIP
    run: |
      test -f synthos-fieldwork-v1.0.0.zip
      unzip -t synthos-fieldwork-v1.0.0.zip

  - name: Extract source project
    run: |
      mkdir -p project
      unzip -q synthos-fieldwork-v1.0.0.zip -d project
      test -f project/settings.gradle.kts
      test -f project/app/build.gradle.kts

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: |
      sdkmanager "platforms;android-35" "build-tools;35.0.0"
      yes | sdkmanager --licenses

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Run unit tests
    working-directory: project
    run: gradle testDebugUnitTest

  - name: Run Android lint
    working-directory: project
    run: gradle lintDebug

  - name: Build debug APK
    working-directory: project
    run: gradle assembleDebug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: SynthOS-debug-APK
      path: project/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
